<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caja Sensorial - Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SISTEMA SENSORIAL</h1>
        <p>Selecciona una pieza y toca su ranura</p>
    </header>

    <main>
        <!-- Tablero con los 8 huecos -->
        <div class="board">
            <div class="slot" data-shape="cuadrado"></div>
            <div class="slot" data-shape="triangulo"></div>
            
            <div class="slot" data-shape="circulo"></div>
            <div class="slot" data-shape="rectangulo"></div>
            
            <div class="slot" data-shape="trapecio"></div>
            <div class="slot" data-shape="rombo"></div>
            
            <div class="slot" data-shape="hexagono"></div>
            <div class="slot" data-shape="pentagono"></div>
        </div>

        <!-- Inventario de piezas -->
        <div class="pieces-container">
            <div class="piece cuadrado" data-shape="cuadrado"></div>
            <div class="piece triangulo" data-shape="triangulo"></div>
            <div class="piece circulo" data-shape="circulo"></div>
            <div class="piece rectangulo" data-shape="rectangulo"></div>
            <div class="piece trapecio" data-shape="trapecio"></div>
            <div class="piece rombo" data-shape="rombo"></div>
            <div class="piece hexagono" data-shape="hexagono"></div>
            <div class="piece pentagono" data-shape="pentagono"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
